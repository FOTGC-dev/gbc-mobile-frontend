</style><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>GBC • Full Builder • Hero Banner Footer Editable</title><link rel="stylesheet" href="style.css"/></head><body>
<header class="header"><div class="nav"><a href="index.html" class="logo"><div class="logo-badge">GBC</div><div class="logo-text"><b>GRAND BILLIONAIRE CITY</b><small>HERO BANNER FOOTER EDITABLE • FULL BUILDER</small></div></a><div class="nav-links" id="navLinks"><a href="panel.html" class="btn btn-gold">Panel • Builder</a><button class="btn btn-red">🛒 CART • <span id="cartCount">0</span></button></div><button class="menu-btn" onclick="document.getElementById('navLinks').classList.toggle('open')">☰</button></div></header>
<div id="root" style="max-width:1280px;margin:0 auto;padding:0 4% 40px"></div>
<div id="footer"></div>
<script>
const FALLBACK="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=600";
const DEFAULT=[
{type:'hero',data:{bg:FALLBACK,title1:'GRAND BILLIONAIRE CITY',title2:'PREMIUM OFFICIAL MARKET',desc:'The Official Global Market of Grand Billionaire City. Trusted by 15,000+ players worldwide since 2022. Luxury vehicles, mansions, businesses, donator packages.',secured:'🔒 SECURED ORDER ID • RATE LIMITED • CAPTCHA',verified:'🛡️ SECURED - ENCRYPTED - VERIFIED OFFICIAL',btn1:'BROWSE 14 CARS',btn2:'VIEW CART'}},
{type:'stats',data:{title:'STATS BAR',items:[{v:'15k+',l:'Players',icon:'👥'},{v:'50k+',l:'Orders',icon:'📦'},{v:'4.9',l:'Rating',icon:'⭐'},{v:'24/7',l:'Support',icon:'⏰'}]}},
{type:'banner',data:{text:'🔥 NEW PRICING: Official ratio 2M=₦400 with 10% OFF! Game Value × ₦180 • 10% OFF • Secured delivery',badge:'NEW'}},
{type:'currency',data:{title:'CURRENCY PACKS',packs:[{name:'2M Cash',sub:'2,000,000 in-game',price:'400 Naira',popular:true},{name:'5M Cash',sub:'5,000,000 in-game',price:'900 Naira'},{name:'10M Cash',sub:'10,000,000 in-game',price:'1700 Naira'},{name:'25M Cash',sub:'25,000,000 in-game',price:'4000 Naira'}]}},
{type:'footer',data:{title:'GRAND BILLIONAIRE CITY',desc:'Official Global Market • Trusted by 15,000+ players worldwide since 2022. Luxury vehicles, mansions, businesses, donator packages. Secure checkout with instant worldwide delivery via WhatsApp.',badge:'● GLOBAL OFFICIAL STORE • WORLDWIDE • SECURED PAYMENTS • ALL SYNCED TO NEON',links:'Currency • Cars • Mansions • Businesses • Donator • Support'}}
];
const MOCK_CARS=[
{ name:'Porsche 911 Turbo S White', price:'₦13,500', image:FALLBACK, stock:'STOCK 5', game_value:'75M', ratio_value:'₦15,000', badge1:'Default SAMP', badge2:'10% OFF - Ratio Pricing', usd_value:'$9 USD' },
{ name:'Bugatti Chiron Blue Black', price:'₦18,000', image:'https://images.unsplash.com/photo-1544636331-e26879cd4d9b?w=600', stock:'STOCK 5', game_value:'100M', ratio_value:'₦20,000', badge1:'Default SAMP', badge2:'10% OFF - Ratio Pricing', usd_value:'$12 USD' }
];
async function getSections(){ try{ const r=await fetch('/api/sections'); const d=await r.json(); if(d.sections&&d.sections.length) return d.sections; }catch{} try{ const s=localStorage.getItem('gbc_full_v3'); if(s) return JSON.parse(s); }catch{} return DEFAULT; }
async function loadNeon(){ try{ const r=await fetch('/api/products'); const d=await r.json(); if(d.products&&d.products.length) return d.products; }catch{} return MOCK_CARS; }
async function render(){
 const secs=await getSections(); const neon=await loadNeon();
 document.getElementById('cartCount').innerText=neon.length;
 let html='', footerHtml='';
 for(const sec of secs){
  if(sec.hidden) continue;
  if(sec.type==='hero'){
   html+=`<div style="margin:16px 0"><div style="position:relative;height:400px;border-radius:24px;overflow:hidden;background:var(--surface);border:1px solid var(--border)"><div style="position:absolute;inset:0"><img src="${sec.data.bg}" style="width:100%;height:100%;object-fit:cover"/></div><div style="position:absolute;inset:0;background:radial-gradient(600px 300px at 20% 20%, rgba(216,173,85,.12), transparent), linear-gradient(180deg, rgba(0,0,0,.1), rgba(7,10,18,.92))"></div><div style="position:absolute;bottom:0;left:0;right:0;padding:20px"><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"><span class="badge badge-green">${sec.data.secured}</span><span class="badge" style="background:rgba(15,26,46,.6);color:#7ab4ff">${sec.data.verified}</span></div><h1 style="font-size:26px;font-weight:900">${sec.data.title1}<br><span style="color:var(--gold)">${sec.data.title2}</span></h1><p style="color:var(--muted);font-size:12px;max-width:520px;margin-top:8px">${sec.data.desc}</p><div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-red">${sec.data.btn1}</button><button class="btn" style="background:rgba(255,255,255,.06)">${sec.data.btn2}</button></div></div></div></div>`;
  }
  if(sec.type==='stats'){
   html+=`<div style="margin:16px 0"><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">${sec.data.items.map(i=>`<div class="card" style="padding:12px;display:flex;gap:10px"><div style="width:36px;height:36px;background:var(--surface-2);border-radius:10px;display:grid;place-items:center;color:var(--gold)">${i.icon||'◍'}</div><div><b>${i.v}</b><div style="font-size:11px;color:var(--muted)">${i.l}</div></div></div>`).join('')}</div></div>`;
  }
  if(sec.type==='banner'){
   html+=`<div style="margin:12px 0"><div style="background:linear-gradient(135deg,var(--surface),var(--surface-2));border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:11px;display:flex;gap:8px;align-items:center"><span style="background:var(--red);color:#fff;padding:3px 10px;border-radius:999px;font-size:9px;font-weight:900">${sec.data.badge||'NEW'}</span>${sec.data.text}</div></div>`;
  }
  if(sec.type==='currency'){
   html+=`<div style="margin:20px 0"><h2 style="font-size:18px;font-weight:900">${sec.data.title}</h2><div class="grid-3" style="margin-top:10px">${sec.data.packs.map(p=>`<div class="card" style="padding:16px;text-align:center;position:relative">${p.popular?'<div style="position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--gold);color:#000;font-size:8px;font-weight:900;padding:4px 10px;border-radius:999px">POPULAR</div>':''}<div style="font-weight:800">${p.name}</div><div style="font-size:11px;color:var(--muted)">${p.sub}</div><div style="color:var(--gold);font-weight:900;margin:8px 0">${p.price}</div><button class="btn btn-red" style="width:100%;font-size:10px">BUY NOW</button></div>`).join('')}</div></div>`;
  }
  if(sec.type==='footer'){
   footerHtml=`<div style="max-width:1280px;margin:20px auto;padding:24px 4%;border-top:1px solid var(--border);color:var(--muted);font-size:11px"><b style="color:var(--text);font-size:12px">${sec.data.title}</b><br>${sec.data.desc}<br><br><span style="color:var(--gold)">${sec.data.badge}</span><br><br><span style="font-size:10px">${sec.data.links}</span></div>`;
  }
 }
 html+=`<div style="margin:20px 0"><div style="font-size:10px;color:var(--gold);letter-spacing:2px;font-weight:800">PREMIUM SHOWROOM • NEON IS LUXURY CARS • EDITABLE</div><h2 style="font-size:18px;font-weight:900">LUXURY CAR COLLECTION • ${neon.length} CARS</h2><div style="display:grid;gap:14px;margin-top:10px">${neon.map(c=>`<div class="card" style="overflow:hidden"><div style="height:200px;position:relative;background:#0a0e1a"><img src="${c.image||c.image_url||FALLBACK}" style="width:100%;height:100%;object-fit:cover"/></div><div style="padding:14px"><div style="display:flex;justify-content:space-between"><b>${c.name}</b><b style="color:var(--gold)">${c.price}</b></div><div style="background:#0a0e1a;border:1px solid var(--border);border-radius:10px;padding:8px;margin:10px 0;font-size:11px;color:var(--muted)">Game: ${c.game_value||'75M'} | Ratio ${c.ratio_value||'₦15,000'} → <span style="color:var(--gold)">${c.price}</span></div><button class="btn btn-red" style="width:100%">ADD TO CART - ${c.price}</button></div></div>`).join('')}</div></div>`;

 document.getElementById('root').innerHTML=html;
 document.getElementById('footer').innerHTML=footerHtml || `<div style="max-width:1280px;margin:20px auto;padding:24px 4%;border-top:1px solid var(--border);color:var(--muted);font-size:11px"><b style="color:var(--text)">GRAND BILLIONAIRE CITY</b> • Official Market • All synced</div>`;
}
document.addEventListener('DOMContentLoaded', render);
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
