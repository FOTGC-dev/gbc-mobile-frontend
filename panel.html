<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>GBC - panel.html</title><link rel="stylesheet" href="style.css"/></head><body>

<div style="padding:30px 5%"><h1 style="font-weight:900">Staff / Owner Panel</h1><p style="color:var(--muted)">Manage products in Neon global. Login as owner / GBC2026!</p><div style="margin-top:20px;display:grid;gap:10px;max-width:400px"><input id="pName" class="input" placeholder="Product Name"/><input id="pPrice" type="number" class="input" placeholder="GC Price"/><input id="pImage" class="input" placeholder="Image URL"/><button class="btn btn-gold" onclick="fetch(BACKEND+'/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:pName.value,gc_price:Number(pPrice.value),stock:999,image_url:pImage.value})}).then(()=>alert('Added to Neon'))">Add to Neon Global</button></div></div>
<footer style="padding:30px 5%;border-top:1px solid var(--border);color:var(--muted);font-size:12px;text-align:center">© 2026 Grand Billionaire City • Connected to Neon • Backend: gbc-mobile-backend.onrender.com</footer>
<script src="script.js"></script></body></html>
