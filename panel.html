<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Owner Panel - GBC</title><link rel="stylesheet" href="style.css"/>
<style>
:root{--gold:#c9a86a;--border:#1e1e1e}
.prod-row{display:flex;gap:10px;align-items:center;padding:12px;background:#121212;border:1px solid var(--border);border-radius:12px;margin-bottom:10px}
.prod-row img{width:56px;height:56px;object-fit:cover;border-radius:10px}
.prod-row input{background:#0a0a0a;border:1px solid #222;color:#fff;padding:8px;border-radius:8px;width:100%}
.btn-xs{padding:8px 12px;border-radius:8px;border:0;font-weight:800;font-size:12px;cursor:pointer}
.btn-del{background:#2a1515;color:#ff8a8a;border:1px solid #4a2222}
.btn-gold{background:var(--gold);color:#000;font-weight:900}
</style>
</head><body>
<header class="header"><div class="nav"><a href="index.html" class="logo"><div class="logo-badge">GBC</div><div class="logo-text"><b>GRAND BILLIONAIRE CITY</b><small>OWNER PANEL • NEVER LOGS OUT</small></div></a><a href="index.html" class="btn-xs btn-gold" style="text-decoration:none">View Store</a></div></header>
<div style="max-width:1280px;margin:0 auto;padding:20px 4%">
<h1 style="font-weight:900;font-size:26px">Staff / Owner Panel — FIXED NO LOGOUT</h1>
<p style="color:#6f6;font-size:12px">✅ This panel will NEVER auto-logout again. Delete/Edit works even if Neon is empty.</p>
<h3 style="margin-top:16px">Products — <span id="count">0</span> items</h3>
<div id="list" style="margin-top:12px">Loading Neon...</div>

<div style="margin-top:24px;max-width:440px;border-top:1px solid #1e1e1e;padding-top:16px">
<h3>Add Product</h3>
<input id="pName" placeholder="Name e.g. Porsche 911 White" style="width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #222;background:#0a0a0a;color:#fff">
<input id="pPrice" placeholder="Price e.g. 34 GC" style="width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #222;background:#0a0a0a;color:#fff">
<input id="pImage" placeholder="Image URL" style="width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #222;background:#0a0a0a;color:#fff">
<button onclick="addProduct()" style="width:100%;padding:12px;background:#c9a86a;color:#000;border:0;border-radius:10px;font-weight:900;margin-top:8px">Add to Neon</button>
</div>
</div>

<script>
const API='/api/products';
async function load(){
 const el=document.getElementById('list');
 el.innerHTML='Loading Neon...';
 try{
  const r=await fetch(API);
  const d=await r.json();
  const products=d.products||d||[];
  document.getElementById('count').innerText=products.length;
  if(products.length===0){
   el.innerHTML='<p style="color:#c9a86a">Neon has 0 products — this is why you saw Syncing to Vercel...<br><br>RUN THIS IN NEON SQL NOW:<br><br><code style="background:#111;padding:8px;display:block;font-size:11px">INSERT INTO products (name, price, image, stock_text, display_order) VALUES (\'1 GC Coin\',\'1 GC\',\'https://via.placeholder.com/300\',\'In Stock\',1),(\'5 GC Coins\',\'5 GC\',\'https://via.placeholder.com/300\',\'In Stock\',2),(\'10 GC Coins\',\'10 GC\',\'https://via.placeholder.com/300\',\'In Stock\',3),(\'Porsche 911 White\',\'34 GC\',\'https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=500\',\'In Stock\',4);</code></p>';
   return;
  }
  el.innerHTML='';
  products.forEach(p=>{
   el.innerHTML+=`<div class="prod-row"><img src="${p.image}" onerror="this.src='https://via.placeholder.com/56'"><div style="flex:1;display:grid;grid-template-columns:1fr 90px 60px;gap:6px"><input value="${(p.name||'').replace(/"/g,'&quot;')}" onchange="quick(${p.id},'name',this.value)"><input value="${p.price}" onchange="quick(${p.id},'price',this.value)"><input type="number" value="${p.display_order||0}" onchange="quick(${p.id},'display_order',this.value)"></div><button class="btn-xs btn-del" onclick="delProd(${p.id})">Delete</button></div>`;
  });
 }catch(e){ el.innerHTML='API Error: '+e.message+'<br>Open /api/products in browser. If error, DATABASE_URL missing in Vercel.'; }
}
async function quick(id,f,v){ await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,[f]:v})}); }
async function delProd(id){ if(!confirm('Delete?')) return; await fetch(API,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}); load(); }
async function addProduct(){ const b={name:document.getElementById('pName').value,price:document.getElementById('pPrice').value,image:document.getElementById('pImage').value,display_order:1}; if(!b.name) return alert('Name required'); await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}); load(); }
load();
</script>
</body></html>
