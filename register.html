<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - GBC</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#171717;padding:30px;border-radius:20px;width:90%;max-width:380px;border:1px solid #222}
h2{margin:0 0 10px 0;font-size:28px}
input{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:none;background:#fff;color:#000;box-sizing:border-box}
button{width:100%;padding:14px;background:#c9a86a;color:#000;border:none;border-radius:12px;font-weight:bold;margin-top:12px;font-size:16px}
.msg{padding:10px;border-radius:8px;margin-top:10px;text-align:center;display:none}
.error{background:#3a1a1a;color:#ff8a8a}
.success{background:#1a3a1a;color:#8aff8a}
a{color:#c9a86a;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<h2>Create Account</h2>
<p style="color:#888;font-size:13px">Join 15k+ Players - GBC Store Global</p>
<input id="username" placeholder="Username">
<input id="email" placeholder="Email" type="email">
<input id="password" placeholder="Password" type="password">
<div id="msg" class="msg"></div>
<button onclick="register()">Create Account</button>
<p style="margin-top:15px;font-size:14px">Already have account? <a href="login.html">Login</a></p>
</div>
<script>
async function register(){
 const username=document.getElementById('username').value.trim();
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value.trim();
 const msg=document.getElementById('msg');
 if(!username||!email||!password){msg.style.display='block';msg.className='msg error';msg.innerText='Fill all fields';return;}
 msg.style.display='block';msg.className='msg';msg.style.background='#222';msg.innerText='Creating...';
 try{
  const res=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,email,password})});
  const data=await res.json();
  if(!res.ok){msg.className='msg error';msg.innerText=data.error||'Failed';return;}
  msg.className='msg success';msg.innerText='Created successfully! Redirecting...';
  setTimeout(()=>{window.location.href='login.html';},1000);
 }catch(e){msg.className='msg error';msg.innerText='Server error: '+e.message;}
}
</script>
</body>
</html>
